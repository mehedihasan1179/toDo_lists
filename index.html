<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do App</title>
    <!-- Inter font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="todo-container">
        <h1>My To-Do List</h1>
    
        <div class="genre-selection">
            <label><input type="radio" name="genre" value="movie" checked> Movie</label>
            <label><input type="radio" name="genre" value="food"> Food</label>
            <label><input type="radio" name="genre" value="travel"> Travel</label>
        </div>
    
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn" class="action-button">Add Task</button>
            <button id="generateTaskBtn" class="action-button">Generate Task</button>
            <button id="nextTaskBtn" class="action-button" style="display: none;">Next Task</button>
        </div>
        <ul id="taskList">
            <!-- Tasks will be added here by JavaScript -->
        </ul>
    </div>

    <script src="./js/app.js"></script>
</body>
</html>
